<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — SaaS Template</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth">
      <div class="auth__card">
        <a class="auth__brand" href="dashboard.html" aria-label="Back to home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 1.5 15 14H1L8 1.5Z" />
            </svg>
          </span>
          <span class="brand-name">Acme</span>
        </a>

        <header class="auth__head">
          <h1 class="auth__title">Sign in to your account</h1>
          <p class="auth__sub">Welcome back — enter your details to continue.</p>
        </header>

        <!-- ─── SSO providers (brand SVGs, swap as needed) ─── -->
        <div class="auth__sso">
          <button class="btn btn--secondary btn--full" type="button">
            <svg class="sso-mark" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.39 0-.19-.01-.7-.01-1.37-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.18-.89-1.18-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.87 2.34.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.83-2.15-.08-.2-.36-1.02.08-2.13 0 0 .67-.21 2.2.82a7.66 7.66 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.11.16 1.93.08 2.13.52.56.83 1.27.83 2.15 0 3.07-1.87 3.75-3.65 3.94.29.25.54.74.54 1.48 0 1.07-.01 1.94-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/>
            </svg>
            Continue with GitHub
          </button>
          <button class="btn btn--secondary btn--full" type="button">
            <svg class="sso-mark" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.79 2.71v2.26h2.9c1.7-1.56 2.69-3.86 2.69-6.61Z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.46-.81 5.95-2.18l-2.9-2.26c-.8.54-1.83.86-3.05.86-2.35 0-4.34-1.58-5.05-3.71H.96v2.33A9 9 0 0 0 9 18Z"/>
              <path fill="#FBBC05" d="M3.95 10.71A5.41 5.41 0 0 1 3.66 9c0-.6.1-1.17.29-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l2.99-2.33Z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 9 9 0 0 0 .96 4.96l2.99 2.33C4.66 5.16 6.65 3.58 9 3.58Z"/>
            </svg>
            Continue with Google
          </button>
        </div>

        <div class="auth__divider"><span>or</span></div>

        <!-- ─── email/password form ─── -->
        <form class="form auth__form" onsubmit="event.preventDefault();">
          <div class="form-field">
            <label for="email">Email</label>
            <input
              id="email"
              class="input"
              type="email"
              autocomplete="email"
              placeholder="you@company.com"
              required
            />
          </div>

          <div class="form-field">
            <div class="form-field__head">
              <label for="password">Password</label>
              <a class="link link--xs" href="#">Forgot password?</a>
            </div>
            <input
              id="password"
              class="input"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </div>

          <label class="toggle">
            <input type="checkbox" />
            <span class="toggle__track"></span>
            <span class="toggle__label">Keep me signed in for 30 days</span>
          </label>

          <button class="btn btn--primary btn--full" type="submit">
            Sign in
          </button>
        </form>

        <p class="auth__foot">
          Don't have an account?
          <a class="link" href="#">Create one →</a>
        </p>
      </div>

      <p class="auth__legal">
        By continuing, you agree to our
        <a class="link" href="#">Terms</a> and
        <a class="link" href="#">Privacy Policy</a>.
      </p>
    </main>
  </body>
</html>
